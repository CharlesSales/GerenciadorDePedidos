services:
  db:
    image: postgres:16-alpine
    container_name: foodflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodflow
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: foodflow_dev
    ports:
      - "5432:5432"
    volumes:
      - foodflow_postgres_data:/var/lib/postgresql/data
      - ./docs/SCHEMA_MVP.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/SEED_MVP.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodflow -d foodflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foodflow_postgres_data:
